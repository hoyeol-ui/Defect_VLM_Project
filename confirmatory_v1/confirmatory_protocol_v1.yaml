  processor:
    loader: AutoImageProcessor.from_pretrained
    exact_class: BitImageProcessor
    convert_rgb: true
    resize: {shortest_edge: 256, resample: PIL_BICUBIC_3}
    center_crop: {height: 224, width: 224}
    rescale_factor: 0.00392156862745098
    normalize_mean: [0.485, 0.456, 0.406]
    normalize_std: [0.229, 0.224, 0.225]
  representation:
    exact_tensor: outputs.pooler_output
    fallback_allowed: false
    dimension: 384
    saved_dtype: float32
  inference:
    full_cache_phase: Phase_2B_only
    device: "cuda:0"
    batch_size: 32
    model_eval: true
    inference_mode: true
    dtype: torch.float32
    autocast: false
    tf32: false
    deterministic_algorithms: true
    cudnn_benchmark: false
  normalization: row_wise_L2_after_float32_CPU_transfer
  distance: "d(x,R) = 1 - max_{r in R} cosine(z_x, z_r)"
  selection: greedy_farthest_first
  reference_set: current_cumulative_labeled_plus_same_query_already_selected
  reference_update: immediate_after_each_pick
  candidate_score_direction: larger_distance_selected_first
  exact_tie_break: sample_id_ascending_with_absolute_tolerance_1e-12
  training_seed_input: forbidden
  completeness_hard_failures:
    - expected_count_not_equal_embedding_rows
    - duplicate_sample_id
    - missing_embedding
    - extra_embedding
    - wrong_dimension
    - NaN_or_infinity
    - zero_norm

