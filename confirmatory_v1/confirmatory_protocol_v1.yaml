primary_endpoint:
  name: two_training_seed_averaged_six_budget_mAP50_95_AULC
  metric: mAP50-95
  budget_axis: labeled_fraction_of_fixed_acquisition_universe
  includes_round0: true
  fully_supervised_normalization: false
  learner_repeat_reduction: arithmetic_mean_of_two_training_seed_AULCs
  primary_unit: acquisition_seed
  paired_contrast: mean_training_seed_AULC_DINO_minus_mean_training_seed_AULC_Random
  reporting_order: dataset_specific_first
  naive_pool_GC10_and_NEU_as_n20: forbidden

aulc:
  exact_definition: >-
    sum_{i=0..4} ((m_i + m_{i+1}) / 2) * (f_{i+1} - f_i)
    divided by (f_5 - f_0), where f_i is labeled_count_i divided by
    the fixed acquisition-universe count.
  interpretation: budget_averaged_mAP50_95_over_the_evaluated_span
  requires_all_six_points: true
  missing_point_interpolation: forbidden
  historical_semantics_preserved: trapezoid_area_divided_by_observed_budget_span

