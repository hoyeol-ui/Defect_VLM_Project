<svg xmlns="http://www.w3.org/2000/svg" width="580" height="730" viewBox="0 0 580 730"><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="black"/></marker></defs><rect width="580" height="730" fill="white"/><rect x="5" y="5" width="570" height="76" fill="white" stroke="black" stroke-width="1.5"/><text x="290" y="37" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#000">GC10-DET and NEU-DET</text><text x="290" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#000">Fixed train / dev / test splits</text><path d="M205 81 L205 105" fill="none" stroke="black" stroke-width="1.8" marker-end="url(#a)"/><path d="M500 81 L500 105" fill="none" stroke="black" stroke-width="1.8" marker-end="url(#a)"/><rect x="5" y="108" width="400" height="86" fill="white" stroke="black" stroke-width="1.5"/><text x="205" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#000">Shared initial 10%</text><text x="205" y="173" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#000">Three paired repeats</text><path d="M205 194 L205 220" fill="none" stroke="black" stroke-width="1.8" marker-end="url(#a)"/><rect x="5" y="224" width="400" height="86" fill="white" stroke="black" stroke-width="1.5"/><text x="205" y="261" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#000">Random / DINOv2-FF / Entropy</text><text x="205" y="289" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#000">Selection within the train pool</text><path d="M205 310 L205 336" fill="none" stroke="black" stroke-width="1.8" marker-end="url(#a)"/><rect x="5" y="340" width="400" height="104" fill="white" stroke="black" stroke-width="1.5"/><text x="205" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#000">10, 15, 20, 25, 30, 35%</text><text x="205" y="400" text-anchor="middle"