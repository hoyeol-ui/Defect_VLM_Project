   <g id="text_1">
    <text style="font-weight: 700; font-size: 23px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #17324d" x="52.218" y="39.15241" transform="rotate(-0 52.218 39.15241)">제한된 라벨에서의 결함 탐지 학습 효율</text>
   </g>
   <g id="text_2">
    <text style="font-size: 12.5px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #53687d" x="52.9128" y="60.12" transform="rotate(-0 52.9128 60.12)">GC10-DET · NEU-DET  |  표본 선택 전략과 전체 학습 기준 비교</text>
   </g>
   <g id="text_3">
    <text style="font-size: 12px; font-family: 'Malgun Gothic'; text-anchor: middle; fill: #17324d" x="566.37" y="111.762563" transform="rotate(-0 566.37 111.762563)">데이터 구성     GC10: 학습 1,604 · 개발 343 · 테스트 344장     /     NEU: 학습 1,258 · 개발 270 · 테스트 270장</text>
   </g>
   <g id="text_4">
