   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Malgun Gothic'; text-anchor: middle; fill: #17324d" x="907.5168" y="598.515562" transform="rotate(-0 907.5168 598.515562)">35% 라벨의 100% 기준 대비 도달률</text>
   </g>
  </g>
  <g id="text_17">
   <text style="font-size: 10px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #53687d" x="58.032" y="660.06" transform="rotate(-0 58.032 660.06)">라벨 예산의 분모는 학습 풀이다. 100% 학습에 개발·테스트 이미지를 포함하지 않는다. nAULC는 10~35% 구간에서 계산한다.</text>
  </g>
