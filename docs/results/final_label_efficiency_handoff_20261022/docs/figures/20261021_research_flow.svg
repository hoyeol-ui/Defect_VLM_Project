   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 13.5px; font-family: 'Malgun Gothic'; text-anchor: start; fill: #b56317" x="799.128" y="156.69" transform="rotate(-0 799.128 156.69)">전체 학습 기준</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 14px; font-family: 'Malgun Gothic'; text-anchor: middle; fill: #17324d" x="383.985" y="207.106094" transform="rotate(-0 383.985 207.106094)">공유 초기 라벨 10%  →  검출기 학습</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 13px; font-family: 'Malgun Gothic'; fill: #b56317" transform="translate(862.634125 217.296922)">전체 학습 풀 100%</text>
