   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 14px; font-family: 'Malgun Gothic'; text-anchor: middle; fill: #ffffff" x="568.107" y="466.466469" transform="rotate(-0 568.107 466.466469)">YOLO26s 학습     SGD + Cosine  ·  100 epoch  ·  입력 640  ·  batch 8</text>
   </g>
   <g id="text_13">
    <text style="font-size: 12.5px; font-family: 'Malgun Gothic'; text-anchor: middle; fill: #17324d" x="568.107" y="535.818914" transform="rotate(-0 568.107 535.818914)">개발 데이터로 best 선정  →  전체 모델·설정 확정  →  별도 최종 평가</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 13px; font-family: 'Malgun Gothic'; text-anchor: middle; fill: #17324d" x="227.655" y="598.983922" transform="rotate(-0 227.655 598.983922)">학습곡선 · nAULC</text>
   </g>
   <g id="text_15">
