name: deterministic-test-harness

on:
  push:
    paths:
      - "src/defect_al/**"
      - "tests/test_identity.py"
      - "tests/test_config.py"
      - "tests/test_leakage.py"
      - "tests/test_preflight_fault_injection.py"
      - "tests/test_preflight_report.py"
      - "tests/test_cross_platform_contract.py"
      - "scripts/00_preflight/**"
      - "configs/frozen/**"
      - "pyproject.toml"
      - ".github/workflows/test-harness.yml"
  pull_request:
    paths:
      - "src/defect_al/**"
      - "tests/test_identity.py"
      - "tests/test_config.py"
      - "tests/test_leakage.py"
      - "tests/test_preflight_fault_injection.py"
      - "tests/test_preflight_report.py"
      - "tests/test_cross_platform_contract.py"
      - "scripts/00_preflight/**"
      - "configs/frozen/**"
      - "pyproject.toml"
      - ".github/workflows/test-harness.yml"

jobs:
  harness:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU-only harness
        run: python -m pip install -e ".[test]"
      - name: Run deterministic harness tests
        run: >-
          python -m pytest -q
          tests/test_identity.py
          tests/test_config.py
          tests/test_leakage.py
          tests/test_preflight_fault_injection.py
          tests/test_preflight_report.py
          tests/test_cross_platform_contract.py
      - name: Compile harness and preflight scripts
        run: python -m compileall -q src tests scripts/00_preflight
